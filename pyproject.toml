[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slide-anki-mcp"
version = "0.2.3"
description = "MCP server that turns lecture PDFs into Anki cards, rejecting any answer the cited slide does not support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "pypdf>=4"]

[project.urls]
Homepage = "https://github.com/2Mesh/slide-anki-mcp"
Issues = "https://github.com/2Mesh/slide-anki-mcp/issues"

[project.optional-dependencies]
test = ["pytest", "reportlab", "arabic-reshaper", "python-bidi"]
# OCR for image-only pages, Windows only (uses the OCR built into Windows 10/11)
ocr = ["winocr>=0.0.15; sys_platform == 'win32'", "pillow"]

[project.scripts]
slide-anki-mcp = "slide_anki_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slide_anki_mcp"]
